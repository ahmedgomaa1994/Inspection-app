<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d2d5a">
<title>الرقابة على الصرف الصناعي</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0d2d5a; --primary-l:#1a4a8a; --primary-xl:#e6edf7;
  --bg:#f5f7fb; --card:#fff; --border:#dbe3ee;
  --text:#0e1b2e; --muted:#64748b;
  --green:#15803d; --green-bg:#dcfce7;
  --red:#b91c1c; --red-bg:#fee2e2;
  --yellow:#a16207; --yellow-bg:#fef3c7;
  --blue:#1d4ed8; --blue-bg:#dbeafe;
  --shadow:0 2px 8px rgba(13,45,90,.08);
  --shadow-lg:0 8px 24px rgba(13,45,90,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:'Cairo',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
input,select,textarea,button{font-family:inherit;font-size:15px}
button{cursor:pointer;border:none;font-weight:600}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:#fff;color:var(--text);-webkit-appearance:none;appearance:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-l);box-shadow:0 0 0 3px rgba(26,74,138,.12)}
textarea{resize:vertical;min-height:70px}
label{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px;color:var(--text)}
label .req{color:var(--red);margin-right:2px}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-size:15px;font-weight:700;transition:transform .08s;min-height:48px;user-select:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn-ghost{background:transparent;color:var(--primary)}
.btn-danger{background:var(--red);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-block{display:flex;width:100%}
.btn-sm{padding:8px 12px;font-size:13px;min-height:38px;border-radius:10px}
.btn-lg{min-height:56px;font-size:16px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.6}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-yellow{background:var(--yellow-bg);color:var(--yellow)}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
.badge-gray{background:#eef2f7;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}

.topbar{position:sticky;top:0;z-index:50;background:var(--primary);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.topbar h1{font-size:15px;margin:0;font-weight:700;flex:1;line-height:1.3}
.topbar .avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0}
.topbar button{background:transparent;color:#fff;padding:8px;border-radius:10px;font-size:13px}

.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:50;box-shadow:0 -2px 12px rgba(13,45,90,.06)}

.bottomnav a.active{color:var(--primary)}
.bottomnav a svg{width:22px;height:22px}

.page{padding:14px;max-width:720px;margin:0 auto}
.page-title{font-size:20px;font-weight:800;margin:6px 0 14px;color:var(--primary);display:flex;align-items:center;gap:10px}
.page-title .sub{font-size:13px;color:var(--muted);font-weight:500;margin-right:auto}

.item{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);border-right:4px solid var(--primary-l);display:block;text-decoration:none;color:inherit;transition:transform .08s}
.item:active{transform:scale(.985)}
.item .row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.item .ttl{font-weight:700;font-size:15px;flex:1;color:var(--primary)}
.item .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow);text-align:center}
.stat .num{font-size:26px;font-weight:800;color:var(--primary);line-height:1.1}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600}
.stat.warn .num{color:var(--red)}

.section-h{display:flex;align-items:center;gap:10px;margin:20px 0 12px;font-weight:800;font-size:16px;color:var(--primary)}
.section-h::before{content:'';width:4px;height:20px;background:var(--primary);border-radius:2px}

.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(120px);background:#1a2436;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200;transition:transform .3s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}

.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--primary),#081e3f)}
.login-box{background:#fff;border-radius:22px;padding:26px 22px;width:100%;max-width:420px;box-shadow:var(--shadow-lg)}
.login-box .logo{width:64px;height:64px;border-radius:18px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:800;margin:0 auto 14px}
.login-box h2{text-align:center;font-size:20px;color:var(--primary);margin:0 0 4px}
.login-box p{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px}
.demo-users{background:var(--primary-xl);border-radius:12px;padding:12px;font-size:12px;margin-top:16px;color:var(--primary);line-height:1.8}
.demo-users b{display:block;margin-bottom:4px;font-size:13px}
.demo-users code{background:#fff;padding:2px 6px;border-radius:6px;font-family:ui-monospace,monospace;font-size:11.5px}

.sample-card{background:var(--primary-xl);border:1.5px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;position:relative}
.sample-card .sample-code{font-family:ui-monospace,monospace;background:#fff;padding:4px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--primary);display:inline-block;margin-bottom:10px}
.sample-card .rm{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;width:28px;height:28px;border-radius:8px;font-size:16px;padding:0}

.res-row{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--border)}
.res-row .name{font-size:13.5px;font-weight:600}
.res-row .name small{display:block;color:var(--muted);font-weight:500;font-size:11.5px;margin-top:2px}
.res-row input{padding:10px 12px;text-align:center;font-weight:700;font-size:15px}
.res-row input.bad{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.res-row input.good{border-color:var(--green)}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty p{margin:0;font-size:14px}
hr.sep{border:none;border-top:1px dashed var(--border);margin:16px 0}
.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px}
.text-muted{color:var(--muted)}
.text-red{color:var(--red)}
.text-green{color:var(--green)}
.tiny{font-size:11.5px}

.modal-bg{position:fixed;inset:0;background:rgba(13,45,90,.6);display:none;align-items:flex-end;justify-content:center;z-index:300;backdrop-filter:blur(2px)}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:20px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-h h3{margin:0;font-size:17px;color:var(--primary)}
.modal-h button{background:transparent;color:var(--muted);font-size:22px;padding:4px 8px;line-height:1}

.pump-row{background:var(--primary-xl);border-radius:12px;padding:12px;margin-bottom:10px;position:relative}
.pump-row .rm{position:absolute;top:6px;left:6px;background:var(--red);color:#fff;width:28px;height:28px;border-radius:8px;font-size:16px;line-height:1;padding:0}

/* Print Styles */
@media print {
  body { background: #fff; padding: 0; margin: 0; }
  .topbar, .bottomnav, .btn, .no-print, .page-title, .section-h { display: none !important; }
  .page { padding: 0; max-width: 100%; }
  .card { box-shadow: none; border: 1px solid #000; border-radius: 0; margin: 0; padding: 20px; }
  .print-header { display: block !important; text-align: center; margin-bottom: 20px; }
  .print-table { width: 100%; border-collapse: collapse; margin: 15px 0; }
  .print-table th, .print-table td { border: 1px solid #000; padding: 8px; text-align: right; }
  .print-footer { margin-top: 40px; display: flex !important; justify-content: space-between; }
}
</style>

<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal-bg"><div class="modal" id="modalContent"></div></div>

<script>
/* ============================================================
   1. DATABASE & STORAGE
============================================================ */
const DB = {
  get(k, def){ try{ const v = localStorage.getItem('app_'+k); return v ? JSON.parse(v) : def; }catch(e){ return def; } },
  set(k, v){ try { localStorage.setItem('app_'+k, JSON.stringify(v)); } catch(e) {} },
  del(k){ try { localStorage.removeItem('app_'+k); } catch(e){} }
};

const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const today = () => new Date().toISOString().slice(0,10);
const nowISO = () => new Date().toISOString();
const fmtDate = d => d ? new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'2-digit',day:'2-digit'}) : '—';
const esc = s => String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(msg, type=''){ const t = $('#toast'); t.textContent = msg; t.className = 'toast show ' + type; clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 2600); }
function openModal(html){ $('#modalContent').innerHTML = html; $('#modal').classList.add('show'); }
function closeModal(){ $('#modal').classList.remove('show'); }

/* ============================================================
   2. UTILITIES (Arabic Numbers, Calculations)
============================================================ */
function numToArabicWords(n){
  n = Math.round(n * 100) / 100;
  const intPart = Math.floor(n);
  const piasters = Math.round((n - intPart) * 100);
  const ones = ['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens = ['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const hundreds = ['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  function three(n){
    if(n===0) return '';
    const h = Math.floor(n/100), r = n%100; const parts = [];
    if(h) parts.push(hundreds[h]);
    if(r){ if(r<20) parts.push(ones[r]); else { const o = r%10, t = Math.floor(r/10); if(o) parts.push(ones[o] + ' و' + tens[t]); else parts.push(tens[t]); } }
    return parts.join(' و');
  }
  function full(n){
    if(n===0) return 'صفر';
    const g = Math.floor(n/1e9), m = Math.floor((n%1e9)/1e6), k = Math.floor((n%1e6)/1000), r = n%1000; const parts = [];
    if(g) parts.push(three(g) + (g===1?' مليار':' مليارات'));
    if(m) parts.push(three(m) + (m===1?' مليون':' ملايين'));
    if(k) parts.push(three(k) + (k===1?' ألف':' آلاف'));
    if(r) parts.push(three(r));
    return parts.filter(Boolean).join(' و');
  }
  let s = full(intPart) + ' جنيهاً مصرياً';
  if(piasters) s += ' و' + full(piasters) + ' قرشاً';
  return s + ' لا غير';
}

function calcTreatmentBurden(sample, result, facility) {
  if(!result) return null;
  const limits = DB.get('lab_limits');
  const settings = DB.get('settings');
  const tiers = DB.get('charge_tiers');
  const monthlyDisposed = (facility.monthly_water_m3 || 0) * ((settings.fees.disposal_ratio || 80) / 100);
  let lines = []; let total = 0;
  
  function findTier(param, val) {
    if(param === 'ph') {
      if(val >= 6 && val <= 9.5) return null;
      if(val >= 2 && val < 6) return tiers.find(t => t.param==='ph' && t.min===2 && t.max===6);
      if(val > 9.5 && val <= 12) return tiers.find(t => t.param==='ph' && t.min===9.5 && t.max===12);
      if(val < 2) return tiers.find(t => t.param==='ph' && t.min===0 && t.max===2);
      if(val > 12) return tiers.find(t => t.param==='ph' && t.min===12 && t.max===14);
      return null;
    }
    // val > min && val <= max (القيمة التي تساوي الحد الأعلى تقع في الشريحة الأدنى)
    return tiers.find(t => t.param===param && val > t.min && val <= t.max);
  }

  const hasBodViolation = result.bod > limits.bod_max;
  const hasCodViolation = result.cod > limits.cod_max;
  const bothViolated = hasBodViolation && hasCodViolation;

  const params = [
    { key:'bod', val: result.bod, label:'BOD' },
    { key:'tss', val: result.tss, label:'TSS' },
    { key:'cod', val: result.cod, label:'COD' },
    { key:'og', val: result.og, label:'O&G' },
    { key:'ph', val: result.ph, label:'pH' }
  ];

  params.forEach(p => {
    if(p.val == null) return;
    const tier = findTier(p.key, p.val);
    if(!tier) return;

    let rate = tier.rate;
    let months = tier.duration;
    // تحويل الأسابيع إلى شهور (أي مهلة أقل من شهر تحسب شهراً واحداً)
    if(tier.unit === 'week') months = Math.max(1, Math.ceil(tier.duration / 4));
    
    let lineTotal = monthlyDisposed * months * rate;
    let discount = 0;
    let note = '';

    if(p.key === 'cod' && bothViolated) {
      discount = lineTotal * 0.40; // خصم 40% لـ COD
      lineTotal -= discount;
      note = 'خصم 40% لاجتماع المخالفة مع BOD';
    }

    lines.push({ param: p.label, value: p.val, tierRate: rate, duration: tier.duration, durationUnit: tier.unit, months: months, total: lineTotal, discount, note });
    total += lineTotal;
  });

  let vat = 0;
  if(settings.fees.vat > 0) vat = total * (settings.fees.vat / 100);
  return { lines, subtotal: total, vat, total: total + vat, monthlyDisposed };
}

function generateClaimsAndNotices(sampleId) {
  const sample = DB.get('samples',[]).find(s=>s.id===sampleId);
  const result = DB.get('results',[]).find(r=>r.sample_id===sampleId && !r.deleted);
  const facility = DB.get('facilities',[]).find(f=>f.id===sample.facility_id);
  const settings = DB.get('settings');
  if(!result || !sample || !facility) return;

  const isPass = result.auto_status === 'pass';
  const claims = DB.get('claims', []);
  const notices = DB.get('compliance_notices', []);

  // 1. مطالبـة تكلفة التحليل
  if(isPass || settings.fees.issue_analysis_for_fail) {
    const analysisClaimExists = claims.find(c => c.sample_id === sampleId && c.type === 'analysis_cost');
    if(!analysisClaimExists) {
      const cost = settings.fees.analysis_cost || 200;
      const vat = cost * (settings.fees.vat / 100);
      claims.push({ id: uid(), type: 'analysis_cost', serial: 'AC-' + (claims.length+1), sample_id: sampleId, facility_id: facility.id, date: today(), base_amount: cost, vat_amount: vat, total: cost + vat, status: 'draft', lines: [{ label: 'تحليل عينة', qty: 1, rate: cost, total: cost }] });
    }
  }

  // 2. مطالبة أعباء التنقية
  const calc = calcTreatmentBurden(sample, result, facility);
  const burdenExists = claims.find(c => c.sample_id === sampleId && c.type === 'treatment_burden');
  if(calc && calc.lines.length > 0 && !burdenExists) {
    claims.push({ id: uid(), type: 'treatment_burden', serial: 'TB-' + (claims.length+1), sample_id: sampleId, facility_id: facility.id, date: today(), base_amount: calc.subtotal, vat_amount: calc.vat, total: calc.total, status: 'draft', lines: calc.lines, monthlyDisposed: calc.monthlyDisposed });
  }

  // 3. نموذج توفيق الأوضاع
  if(!isPass && !notices.find(n => n.sample_id === sampleId)) {
    notices.push({ id: uid(), serial: 'CN-' + (notices.length+1), sample_id: sampleId, facility_id: facility.id, date: today(), status: 'draft', lines: calc.lines });
  }

  DB.set('claims', claims);
  DB.set('compliance_notices', notices);
}

/* ============================================================
   3. SEED DATA (Matches Requirements)
============================================================ */
const BRANCH_NAMES = ['بنها','مركز بنها','طوخ','كفر شكر','قها','قليوب','شبين القناطر','القناطر الخيرية','الخصوص','غرب شبرا','شمال الخانكة','جنوب الخانكة'];
const DEFAULT_TIERS = [
  { param:'bod', min:244, max:600, type:'plant', rate:1, duration:6, unit:'month' },
  { param:'bod', min:600, max:660, type:'violation', rate:3, duration:6, unit:'month' },
  { param:'bod', min:660, max:2000, type:'violation', rate:9, duration:3, unit:'month' },
  { param:'bod', min:2000, max:999999, type:'violation', rate:18, duration:2, unit:'week' },
  { param:'tss', min:339, max:800, type:'plant', rate:0.5, duration:6, unit:'month' },
  { param:'tss', min:800, max:880, type:'violation', rate:2, duration:6, unit:'month' },
  { param:'tss', min:880, max:3000, type:'violation', rate:5, duration:3, unit:'month' },
  { param:'tss', min:3000, max:999999, type:'violation', rate:15, duration:1, unit:'week' },
  { param:'cod', min:1100, max:2000, type:'violation', rate:6, duration:3, unit:'month' },
  { param:'cod', min:2000, max:5000, type:'violation', rate:18, duration:2, unit:'month' },
  { param:'cod', min:5000, max:999999, type:'violation', rate:30, duration:1, unit:'week' },
  { param:'og', min:100, max:1000, type:'violation', rate:10, duration:1, unit:'month' },
  { param:'og', min:1000, max:999999, type:'violation', rate:25, duration:2, unit:'week' },
  { param:'ph', min:2, max:6, type:'violation', rate:30, duration:2, unit:'week' },
  { param:'ph', min:9.5, max:12, type:'violation', rate:30, duration:2, unit:'week' },
  { param:'ph', min:0, max:2, type:'violation', rate:60, duration:1, unit:'week' },
  { param:'ph', min:12, max:14, type:'violation', rate:60, duration:1, unit:'week' }
];

function seedIfEmpty(){
  if(DB.get('seeded')) return;
  DB.set('branches', BRANCH_NAMES.map((name,i)=>({ id: 'b'+(i+1), name, code: i+1, groundwater_billing_enabled: i<6, active: true })));
  DB.set('labs', [{ id:'lab1', name:'معمل بنها المركزي' }, { id:'lab2', name:'معمل القليوبية' }, { id:'lab3', name:'معمل شبين' }]);
  DB.set('users', [
    { id:'u1', name:'م. أحمد المدير العام', username:'admin', password:'1234', role:'gm', active:true },
    { id:'u2', name:'م. سارة مدير الرقابة', username:'supervisor', password:'1234', role:'control_mgr', active:true },
    { id:'u3', name:'م. خالد مدير التحكم', username:'claims', password:'1234', role:'control_claims', active:true },

/* ============================================================
   4. AUTH & ROUTER
============================================================ */
const Session = { user: null };
function login(username, password){
  const u = DB.get('users', []).find(x => x.username === username && x.password === password && x.active);
  if(!u){ toast('بيانات الدخول غير صحيحة', 'error'); return false; }
  Session.user = u; DB.set('session', u); location.hash = '#/home'; return true;
}
function logout(){ Session.user = null; DB.del('session'); location.hash = '#/login'; }
function branchName(id){ return DB.get('branches',[]).find(b=>b.id===id)?.name || '—'; }
function roleLabel(r){ return { gm:'المدير العام', control_mgr:'مدير الرقابة', control_claims:'مدير التحكم', collection_mgr:'مدير التحصيل', licensing_mgr:'مدير التراخيص', field:'فريق المعاينات' }[r] || r; }

const routes = {};
function route(path, render){ routes[path] = render; }

function router(){
  const hash = location.hash || '#/login';
  const pathString = hash.slice(1);
  
  if(!Session.user && pathString !== '/login'){ location.hash = '#/login'; return; }
  if(Session.user && pathString === '/login'){ location.hash = '#/home'; return; }

  if (routes[pathString]) { routes[pathString](); return; }

  const parts = pathString.split('/').filter(Boolean);
  const path = '/' + parts[0];
  const fn = routes[path];
  
  if(fn){ fn(...parts.slice(1)); } else { layout(`<div class="empty"><p>الصفحة غير موجودة</p></div>`, ''); }
}

window.addEventListener('hashchange', router);
window.addEventListener('DOMContentLoaded', () => {
  seedIfEmpty();
  const saved = DB.get('session', null);
  if(saved){ const u = DB.get('users',[]).find(x=>x.id===saved.id); if(u && u.active){ Session.user = u; location.hash = '#/home'; } }
  router();
});

function layout(content, active){
  const u = Session.user;
  const navItems = [
    { href:'#/home', label:'الرئيسية', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg>' },
    { href:'#/plans', label:'الخطة', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>' },
    { href:'#/inspections', label:'المعاينات', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>' },
    { href:'#/facilities', label:'المنشآت', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 9h.01M9 13h.01M9 17h.01M15 9h.01M15 13h.01M15 17h.01"/></svg>' },
    { href:'#/more', label:'المزيد', icon:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>' }
  ];
  $('#app').innerHTML = `
    <div class="topbar">
      <div class="avatar">${esc(u.name.charAt(0))}</div>
      <h1>${esc(u.name)}<div style="font-size:11.5px;font-weight:500;opacity:.85">${roleLabel(u.role)}</div></h1>
      <button onclick="logout()">خروج</button>
    </div>
    <div class="page">${content}</div>
    <nav class="bottomnav">
      ${navItems.map(n=>`<a href="${n.href}" class="${active===n.label?'active':''}">${n.icon}<span>${n.label}</span></a>`).join('')}
    </nav>
  `;
}
