<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d2d5a">
<title>الرقابة على الصرف الصناعي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--p:#0d2d5a;--pl:#1a4a8a;--bg:#f5f7fb;--c:#fff;--b:#dbe3ee;--t:#0e1b2e;--m:#64748b;--g:#15803d;--gb:#dcfce7;--r:#b91c1c;--rb:#fee2e2;--y:#a16207;--yb:#fef3c7;--bl:#1d4ed8;--blb:#dbeafe;--sh:0 2px 8px rgba(13,45,90,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:'Cairo',sans-serif;background:var(--bg);color:var(--t);font-size:15px;line-height:1.5}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
input,select,textarea,button{font-family:inherit;font-size:15px}
button{cursor:pointer;border:none;font-weight:600}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--b);border-radius:12px;background:#fff;color:var(--t);-webkit-appearance:none}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--pl);box-shadow:0 0 0 3px rgba(26,74,138,.12)}
textarea{resize:vertical;min-height:70px}
label{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px}
label .req{color:var(--r)}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:380px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-size:15px;font-weight:700;min-height:48px}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--p);color:#fff}
.btn-o{background:#fff;color:var(--p);border:1.5px solid var(--p)}
.btn-d{background:var(--r);color:#fff}
.btn-g{background:var(--g);color:#fff}
.btn-block{display:flex;width:100%}
.btn-sm{padding:8px 12px;font-size:13px;min-height:38px;border-radius:10px}
.btn-lg{min-height:56px;font-size:16px}
.card{background:var(--c);border-radius:16px;padding:16px;box-shadow:var(--sh);margin-bottom:12px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700}
.bg{background:var(--gb);color:var(--g)}
.br{background:var(--rb);color:var(--r)}
.by{background:var(--yb);color:var(--y)}
.bbl{background:var(--blb);color:var(--bl)}
.bgy{background:#eef2f7;color:var(--m)}
.hint{font-size:12px;color:var(--m);margin-top:4px}
.tb{position:sticky;top:0;z-index:50;background:var(--p);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;box-shadow:var(--sh)}
.tb h1{font-size:15px;margin:0;font-weight:700;flex:1}
.tb .av{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800}
.tb button{background:transparent;color:#fff;padding:8px;font-size:13px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--b);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:50}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;color:var(--m);text-decoration:none;font-size:11px;font-weight:600;min-height:60px}
.nav a.active{color:var(--p)}
.nav a svg{width:22px;height:22px}
.page{padding:14px;max-width:720px;margin:0 auto}
.pt{font-size:20px;font-weight:800;margin:6px 0 14px;color:var(--p);display:flex;align-items:center;gap:10px}
.pt .sub{font-size:13px;color:var(--m);font-weight:500;margin-right:auto}
.item{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--sh);border-right:4px solid var(--pl);display:block;text-decoration:none;color:inherit}
.item .row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.item .ttl{font-weight:700;font-size:15px;flex:1;color:var(--p)}
.item .meta{font-size:12.5px;color:var(--m);display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:14px;padding:14px;box-shadow:var(--sh);text-align:center}
.stat .num{font-size:26px;font-weight:800;color:var(--p);line-height:1.1}
.stat .lbl{font-size:12px;color:var(--m);margin-top:4px;font-weight:600}
.stat.warn .num{color:var(--r)}
.sh{display:flex;align-items:center;gap:10px;margin:20px 0 12px;font-weight:800;font-size:16px;color:var(--p)}
.sh::before{content:'';width:4px;height:20px;background:var(--p);border-radius:2px}
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(120px);background:#1a2436;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;z-index:200;transition:transform .3s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--g)}
.toast.error{background:var(--r)}
.modal-bg{position:fixed;inset:0;background:rgba(13,45,90,.6);display:none;align-items:flex-end;justify-content:center;z-index:300}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:20px}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mh h3{margin:0;font-size:17px;color:var(--p)}
.mh button{background:transparent;color:var(--m);font-size:22px;padding:4px 8px;line-height:1}
.empty{text-align:center;padding:50px 20px;color:var(--m)}
.empty p{margin:0;font-size:14px}
.mono{font-family:ui-monospace,monospace;font-size:13px}
.tm{color:var(--m)}
.tr{color:var(--r)}
.tg{color:var(--g)}
.tiny{font-size:11.5px}
.lw{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--p),#081e3f)}
.lb{background:#fff;border-radius:22px;padding:26px 22px;width:100%;max-width:420px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.lb .logo{width:64px;height:64px;border-radius:18px;background:var(--p);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:800;margin:0 auto 14px}
.lb h2{text-align:center;font-size:20px;color:var(--p);margin:0 0 4px}
.lb p{text-align:center;color:var(--m);font-size:13px;margin:0 0 20px}
.du{background:#e6edf7;border-radius:12px;padding:12px;font-size:12px;margin-top:16px;color:var(--p);line-height:1.8}
.du b{display:block;margin-bottom:4px}
.du code{background:#fff;padding:2px 6px;border-radius:6px;font-family:monospace;font-size:11.5px}
.sc{background:#e6edf7;border:1.5px solid var(--b);border-radius:12px;padding:12px;margin-bottom:10px;position:relative}
.sc .code{font-family:monospace;background:#fff;padding:4px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--p);display:inline-block;margin-bottom:10px}
.sc .rm{position:absolute;top:8px;left:8px;background:var(--r);color:#fff;width:28px;height:28px;border-radius:8px;font-size:16px;padding:0}
.pr{background:#e6edf7;border-radius:12px;padding:12px;margin-bottom:10px;position:relative}
.pr .rm{position:absolute;top:6px;left:6px;background:var(--r);color:#fff;width:28px;height:28px;border-radius:8px;font-size:16px;padding:0}
.res-row{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--b)}
.res-row .name{font-size:13.5px;font-weight:600}
.res-row .name small{display:block;color:var(--m);font-weight:500;font-size:11.5px}
.res-row input{padding:10px;text-align:center;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:999px;background:#fff;border:1.5px solid var(--b);font-size:13px;font-weight:600;color:var(--m);white-space:nowrap}
.chip.active{background:var(--p);color:#fff;border-color:var(--p)}
/* Print */
@media print{
  body{background:#fff;padding:0}
  .tb,.nav,.btn,.no-print,.pt,.sh{display:none!important}
  .page{padding:0;max-width:100%}
  .card{box-shadow:none;border:1px solid #000;border-radius:0;margin:0;padding:20px}
  .ph{display:block!important;text-align:center;margin-bottom:20px}
  .pt-tb{width:100%;border-collapse:collapse;margin:15px 0}
  .pt-tb th,.pt-tb td{border:1px solid #000;padding:8px;text-align:right}
  .pf{display:flex!important;justify-content:space-between;margin-top:40px}
}
.ph,.pf{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal-bg"><div class="modal" id="modalContent"></div></div>

<script>
/* ============ STORAGE & UTILS ============ */
const DB={
  get(k,d){try{const v=localStorage.getItem('a_'+k);return v?JSON.parse(v):d}catch(e){return d}},
  set(k,v){try{localStorage.setItem('a_'+k,JSON.stringify(v))}catch(e){}},
  del(k){try{localStorage.removeItem('a_'+k)}catch(e){}}
};
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const today=()=>new Date().toISOString().slice(0,10);
const nowISO=()=>new Date().toISOString();
const fmtDate=d=>d?new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'2-digit',day:'2-digit'}):'—';
const fmtMoney=n=>(Math.round(n*100)/100).toLocaleString('ar-EG',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function toast(m,t=''){const el=$('#toast');el.textContent=m;el.className='toast show '+t;clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2600)}
function openModal(h){$('#modalContent').innerHTML=h;$('#modal').classList.add('show')}
function closeModal(){$('#modal').classList.remove('show')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

function numToArabicWords(n){
  n=Math.round(n*100)/100;
  const ip=Math.floor(n),piasters=Math.round((n-ip)*100);
  const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];
  const tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];
  const hundreds=['','مائة','مائتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];
  const three=n=>{if(!n)return'';const h=Math.floor(n/100),r=n%100,ps=[];if(h)ps.push(hundreds[h]);if(r){if(r<20)ps.push(ones[r]);else{const o=r%10,t=Math.floor(r/10);ps.push(o?ones[o]+' و'+tens[t]:tens[t])}}return ps.join(' و')};
  const full=n=>{if(!n)return'صفر';const g=Math.floor(n/1e9),m=Math.floor((n%1e9)/1e6),k=Math.floor((n%1e6)/1000),r=n%1000,ps=[];if(g)ps.push(three(g)+(g===1?' مليار':' مليارات'));if(m)ps.push(three(m)+(m===1?' مليون':' ملايين'));if(k)ps.push(three(k)+(k===1?' ألف':' آلاف'));if(r)ps.push(three(r));return ps.filter(Boolean).join(' و')};
  let s=full(ip)+' جنيهاً مصرياً';
  if(piasters)s+=' و'+full(piasters)+' قرشاً';
  return s+' لا غير';
}

/* ============ SEED DATA (Matches Spec) ============ */
const BRANCHES=['بنها','مركز بنها','طوخ','كفر شكر','قها','قليوب','شبين القناطر','القناطر الخيرية','الخصوص','غرب شبرا','شمال الخانكة','جنوب الخانكة'];
const TIERS=[
  {p:'bod',min:244,max:600,type:'plant',rate:1,dur:6,u:'month'},
  {p:'bod',min:600,max:660,type:'viol',rate:3,dur:6,u:'month'},
  {p:'bod',min:660,max:2000,type:'viol',rate:9,dur:3,u:'month'},
  {p:'bod',min:2000,max:999999,type:'viol',rate:18,dur:2,u:'week'},
  {p:'tss',min:339,max:800,type:'plant',rate:.5,dur:6,u:'month'},
  {p:'tss',min:800,max:880,type:'viol',rate:2,dur:6,u:'month'},
  {p:'tss',min:880,max:3000,type:'viol',rate:5,dur:3,u:'month'},
  {p:'tss',min:3000,max:999999,type:'viol',rate:15,dur:1,u:'week'},
  {p:'cod',min:1100,max:2000,type:'viol',rate:6,dur:3,u:'month'},
  {p:'cod',min:2000,max:5000,type:'viol',rate:18,dur:2,u:'month'},
  {p:'cod',min:5000,max:999999,type:'viol',rate:30,dur:1,u:'week'},
  {p:'og',min:100,max:1000,type:'viol',rate:10,dur:1,u:'month'},
  {p:'og',min:1000,max:999999,type:'viol',rate:25,dur:2,u:'week'},
  {p:'ph',min:2,max:6,type:'viol',rate:30,dur:2,u:'week'},
  {p:'ph',min:9.5,max:12,type:'viol',rate:30,dur:2,u:'week'},
  {p:'ph',min:0,max:2,type:'viol',rate:60,dur:1,u:'week'},
  {p:'ph',min:12,max:14,type:'viol',rate:60,dur:1,u:'week'}
];

function seed(){
  if(DB.get('seeded'))return;
  DB.set('branches',BRANCHES.map((n,i)=>({id:'b'+(i+1),name:n,code:i+1,gw_enabled:i<6})));
  DB.set('labs',[{id:'l1',name:'معمل بنها'},{id:'l2',name:'معمل القليوبية'},{id:'l3',name:'معمل شبين'}]);
  DB.set('users',[
    {id:'u1',name:'م. أحمد المدير',username:'admin',password:'1234',role:'gm',active:true},
    {id:'u2',name:'م. سارة رقابة',username:'supervisor',password:'1234',role:'control_mgr',active:true},
    {id:'u3',name:'م. خالد تحكم',username:'claims',password:'1234',role:'control_claims',active:true},
    {id:'u4',name:'م. منى تحصيل',username:'collection',password:'1234',role:'collection_mgr',active:true},
    {id:'u5',name:'م. طارق تراخيص',username:'licensing',password:'1234',role:'licensing_mgr',active:true},
    {id:'u6',name:'ك. هدى كيميائية',username:'chemist',password:'1234',role:'field',job_title:'chemist',branch_id:'b1',active:true},
    {id:'u7',name:'ف. محمد فني',username:'tech',password:'1234',role:'field',job_title:'technician',branch_id:'b1',active:true},
    {id:'u8',name:'م. علي مهندس',username:'eng',password:'1234',role:'field',job_title:'engineer',branch_id:'b6',active:true}
  ]);
  DB.set('assignments',[
    {branch_id:'b1',primary:'u2'},{branch_id:'b2',primary:'u2'},{branch_id:'b3',primary:'u6'},
    {branch_id:'b4',primary:'u6'},{branch_id:'b5',primary:'u6'},{branch_id:'b6',primary:'u8'},
    {branch_id:'b7',primary:'u8'},{branch_id:'b8',primary:'u8'},{branch_id:'b9',primary:'u2'},
    {branch_id:'b10',primary:'u2'},{branch_id:'b11',primary:'u2'},{branch_id:'b12',primary:'u2'}
  ]);
  DB.set('limits',{bod:600,tss:800,cod:1100,og:100,ph_min:6,ph_max:9.5});
  DB.set('fees',{
    insp_comm:100,insp_ind:300,transport:0,vat:14,gw_rate:6,analysis:200,
    disposal_ratio:80,cod_discount:40,apply_vat_burden:false,issue_analysis_fail:false,
    pay_days:30,delay_days:60
  });
  DB.set('tiers',TIERS);
  
  const facs=[
    {name:'مصنع النور للغزل',owner:'حسن محمد',addr:'شارع الجمهورية، بنها',bid:'b1',cls:'industrial',act:'غزل',water:1000,src:'gov',acct:'88451200',dest:'network'},
    {name:'محطة وقود التعاون',owner:'سامي',addr:'ميدان المحطة',bid:'b1',cls:'commercial',act:'وقود',water:1000,src:'gov',acct:'88451201',dest:'network'},
    {name:'فندق النيل',owner:'شركة سياحة',addr:'كورنيش النيل',bid:'b1',cls:'commercial',act:'فندق',water:800,src:'gov',acct:'88451300',dest:'network'},
    {name:'مصنع الشرق للبلاستيك',owner:'ياسر',addr:'شبين',bid:'b7',cls:'industrial',act:'بلاستيك',water:1500,src:'gov',acct:'66120500',dest:'network'},
    {name:'مغسلة الأناقة',owner:'أحمد',addr:'15 مايو',bid:'b1',cls:'commercial',act:'مغسلة',water:200,src:'gov',acct:'88451400',dest:'network'},
    {name:'مصنع الدلتا للأغذية',owner:'كريم',addr:'قليوب',bid:'b6',cls:'industrial',act:'غذائية',water:2500,src:'gov',acct:'77100200',dest:'network'},
    {name:'مزرعة الدواجن',owner:'عبد الله',addr:'طوخ',bid:'b3',cls:'other',act:'دواجن',water:600,src:'gw',acct:null,dest:'network',pumps:[{hp:15,mode:'hours',hours:10}]},
    {name:'مصنع الحديد',owner:'شركة',addr:'قليوب',bid:'b6',cls:'industrial',act:'حديد',water:5000,src:'gov',acct:'77100800',dest:'network'},
    {name:'مطعم البركة',owner:'محمد رضا',addr:'وسط البلد',bid:'b1',cls:'commercial',act:'مطعم',water:150,src:'gov',acct:'88451500',dest:'network'},
    {name:'مصنع كيماويات النيل',owner:'م. مصطفى',addr:'المنطقة الصناعية',bid:'b11',cls:'industrial',act:'كيماويات',water:3500,src:'both',acct:'99120300',dest:'network',pumps:[{hp:20,mode:'hours',hours:8}]}
  ];
  const counters={};
  const facilities=facs.map((d,i)=>{
    counters[d.bid]=(counters[d.bid]||0)+1;
    const bid=d.bid,br=DB.get('branches').find(b=>b.id===bid);
    return {id:'f'+(i+1),name:d.name,owner:d.owner,address:d.addr,branch_id:bid,code:`${counters[d.bid]}/${br.code}`,classification:d.cls,activity:d.act,monthly_water_m3:d.water,water_source_type:d.src,gov_account:d.acct,disposal_destination:d.dest,disposal_type:'industrial',pumps:d.pumps||[],work_days:26,registered_at:nowISO(),deleted:false};
  });
  DB.set('facilities',facilities);
  DB.set('counters',counters);
  
  // 15 Samples (spec: normal pass, plant-range pass, BOD+COD fail, pH fail, TSS>3000)
  const sampleDefs=[
    {f:0,bod:250,tss:300,cod:800,og:50,ph:7.2,status:'pass'},
    {f:0,bod:550,tss:700,cod:1000,og:80,ph:7,status:'pass'},
    {f:1,bod:180,tss:200,cod:600,og:40,ph:7.1,status:'pass'},
    {f:5,bod:700,tss:900,cod:1500,og:120,ph:7,status:'fail'},
    {f:5,bod:800,tss:950,cod:1600,og:150,ph:7,status:'fail'},
    {f:2,bod:200,tss:250,cod:700,og:60,ph:1.5,status:'fail'},
    {f:3,bod:400,tss:3200,cod:900,og:80,ph:7.3,status:'fail'},
    {f:4,bod:150,tss:180,cod:500,og:30,ph:7.5,status:'pass'},
    {f:6,bod:650,tss:820,cod:1200,og:110,ph:7,status:'fail'},
    {f:7,bod:500,tss:750,cod:1000,og:90,ph:7,status:'pass'},
    {f:8,bod:300,tss:400,cod:800,og:70,ph:7,status:'pass'},
    {f:9,bod:900,tss:1200,cod:2500,og:200,ph:6,status:'fail'},
    {f:0,bod:280,tss:340,cod:850,og:55,ph:7.2,status:'pass'},
    {f:5,bod:450,tss:500,cod:950,og:90,ph:7,status:'pass'},
    {f:1,bod:350,tss:400,cod:900,og:60,ph:7.3,status:'pass'}
  ];
  const samples=[],results=[];
  sampleDefs.forEach((d,i)=>{
    const fac=facilities[d.f],br=DB.get('branches').find(b=>b.id===fac.branch_id);
    const dt=new Date(Date.now()-(30-i*2)*864e5);

/* ============ CALCULATION ENGINE ============ */
function calcBurden(sample,result,fac){
  if(!result||!fac||!fac.monthly_water_m3)return null;
  const lim=DB.get('limits'),fees=DB.get('fees'),tiers=DB.get('tiers');
  const disposed=fac.monthly_water_m3*(fees.disposal_ratio/100);
  const lines=[];let sub=0;
  const findTier=(p,v)=>{
    if(p==='ph'){
      if(v>=lim.ph_min&&v<=lim.ph_max)return null;
      if(v>=2&&v<6)return tiers.find(t=>t.p==='ph'&&t.min===2&&t.max===6);
      if(v>9.5&&v<=12)return tiers.find(t=>t.p==='ph'&&t.min===9.5&&t.max===12);
      if(v<2)return tiers.find(t=>t.p==='ph'&&t.min===0&&t.max===2);
      if(v>12)return tiers.find(t=>t.p==='ph'&&t.min===12);
      return null;
    }
    return tiers.find(t=>t.p===p&&v>t.min&&v<=t.max);
  };
  const bodFail=result.bod>lim.bod, codFail=result.cod>lim.cod, both=bodFail&&codFail;
  const params=[{k:'bod',v:result.bod,lbl:'BOD'},{k:'tss',v:result.tss,lbl:'TSS'},{k:'cod',v:result.cod,lbl:'COD'},{k:'og',v:result.og,lbl:'O&G'},{k:'ph',v:result.ph,lbl:'pH'}];
  params.forEach(p=>{
    if(p.v==null)return;
    const t=findTier(p.k,p.v);if(!t)return;
    let months=t.dur;
    if(t.u==='week')months=Math.max(1,Math.ceil(t.dur/4));
    let total=disposed*months*t.rate,discount=0;
    if(p.k==='cod'&&both){discount=total*(fees.cod_discount/100);total-=discount}
    lines.push({label:p.lbl,value:p.v,rate:t.rate,months,dur:t.dur,unit:t.u,total,discount});
    sub+=total;
  });
  let vat=0;
  if(fees.apply_vat_burden)vat=sub*(fees.vat/100);
  return {lines,sub,v at,vat,total:sub+vat,disposed};
}

function generateFromSample(sampleId){
  const s=DB.get('samples',[]).find(x=>x.id===sampleId);
  const r=DB.get('results',[]).find(x=>x.sample_id===sampleId&&!x.deleted);
  const f=DB.get('facilities',[]).find(x=>x.id===s.facility_id);
  if(!s||!r||!f)return;
  const fees=DB.get('fees'),claims=DB.get('claims',[]),notices=DB.get('compliance_notices',[]);
  const isPass=r.auto_status==='pass';
  
  // Analysis Cost
  if(!claims.find(c=>c.sample_id===sampleId&&c.type==='analysis_cost')){
    if(isPass||fees.issue_analysis_fail){
      const b=fees.analysis,vat=b*(fees.vat/100);
      claims.push({id:uid(),type:'analysis_cost',serial:'AC-'+(claims.length+1),sample_id:sampleId,facility_id:f.id,date:today(),base_amount:b,vat_amount:vat,total:b+vat,status:'draft',lines:[{label:'تحليل عينة '+s.code,qty:1,rate:b,total:b}]});
    }
  }
  
  // Treatment Burden
  const calc=calcBurden(s,r,f);
  if(calc&&calc.lines.length&&!claims.find(c=>c.sample_id===sampleId&&c.type==='treatment_burden')){
    claims.push({id:uid(),type:'treatment_burden',serial:'TB-'+(claims.length+1),sample_id:sampleId,facility_id:f.id,date:today(),base_amount:calc.sub,vat_amount:calc.vat,total:calc.total,status:'draft',lines:calc.lines,disposed:calc.disposed});
  }
  
  // Compliance Notice
  if(!isPass&&!notices.find(n=>n.sample_id===sampleId)){
    notices.push({id:uid(),serial:'CN-'+(notices.length+1),sample_id:sampleId,facility_id:f.id,date:today(),status:'draft',lines:calc?.lines||[],delivery_date:null});
  }
  
  DB.set('claims',claims);
  DB.set('compliance_notices',notices);
}

function autoPlan(){
  const plans=DB.get('plan_items',[]);
  const facs=DB.get('facilities',[]).filter(f=>!f.deleted);
  const samples=DB.get('samples',[]).filter(s=>!s.deleted);
  const results=DB.get('results',[]).filter(r=>!r.deleted);
  const now=Date.now();
  let added=0;
  facs.forEach(f=>{
    if(plans.find(p=>p.facility_id===f.id&&p.status==='scheduled'))return;
    const lastSample=samples.filter(s=>s.facility_id===f.id).sort((a,b)=>b.collected_at.localeCompare(a.collected_at))[0];
    const lastResult=lastSample?results.find(r=>r.sample_id===lastSample.id):null;
    let priority='medium',reason='دورية';
    if(lastResult&&lastResult.auto_status==='fail'){priority='high';reason='متابعة غير مطابق'}
    else if(!lastSample||(now-new Date(f.registered_at).getTime())/(864e5)>180){priority='medium';reason='دورية (6 أشهر)'}
    else return;
    plans.push({id:uid(),date:new Date(now+(added+1)*864e5).toISOString().slice(0,10),facility_id:f.id,branch_id:f.branch_id,inspector_id:'u6',status:'scheduled',priority,reason});
    added++;
  });
  DB.set('plan_items',plans);
  toast(`تم إنشاء ${added} بند في الخطة`,'success');
  nav();
}

function setPlanStatus(id,st){
  const plans=DB.get('plan_items',[]);
  const i=plans.findIndex(p=>p.id===id);
  if(i>=0){plans[i].status=st;DB.set('plan_items',plans);toast('تم التحديث','success');nav()}
}

}

function saveInsp(id,asDraft){
  const form=$('#inspForm');
  const get=n=>form.querySelector(`[name="${n}"]`)?.value||'';
  const u=Session.user;
  const data={
    reason:get('reason'),inspection_date:get('inspection_date'),branch_id:get('branch_id'),
    name:get('name').trim(),address:get('address').trim(),owner:get('owner').trim(),tenant:get('tenant').trim(),
    classification:get('classification'),activity:get('activity').trim(),
    workers:parseInt(get('workers'))||0,shifts:parseInt(get('shifts'))||0,
    weekly_off:get('weekly_off').trim(),work_days:parseInt(get('work_days'))||26,
    responsible_name:get('responsible_name').trim(),responsible_phone:get('responsible_phone').trim(),
    monthly_water_m3:parseFloat(get('monthly_water_m3'))||0,
    water_source_type:get('water_source_type'),gov_account:get('gov_account').trim(),
    pumps:[...form.querySelectorAll('[data-pump]')].map(p=>({hp:parseInt(p.querySelector('.pump-hp').value||'0'),mode:p.querySelector('.pump-mode').value,hours:parseInt(p.querySelector('.pump-h')?.value||'0')})).filter(p=>p.hp>0),
    disposal_type:get('disposal_type'),disposal_destination:get('disposal_destination'),
    notes:get('notes').trim(),
    samples:[...form.querySelectorAll('[data-sample]')].map(s=>({outlet:s.querySelector('.s-outlet').value.trim(),lab_id:s.querySelector('.s-lab').value,type:'simple'}))
  };
  
  if(!data.name||!data.address||!data.owner){toast('الحقول الإجبارية ناقصة','error');return}
  
  if(data.disposal_destination==='external_tanker'&&!asDraft){
    DB.set('cancelled',[...DB.get('cancelled',[]),{id:uid(),...data,cancelled_at:nowISO()}]);
    toast('تم الحفظ في أرشيف الملغاة','success');location.hash='#/inspections';return;
  }
  
  const facilities=DB.get('facilities',[]).filter(f=>!f.deleted);
  const dup=facilities.find(f=>f.name===data.name&&f.address===data.address);
  let facId,code;
  if(dup){facId=dup.id;code=dup.code;const idx=facilities.findIndex(f=>f.id===dup.id);facilities[idx]={...facilities[idx],...data};DB.set('facilities',facilities)}
  else{
    const counters=DB.get('counters',{}),br=DB.get('branches',[]).find(b=>b.id===data.branch_id);
    counters[data.branch_id]=(counters[data.branch_id]||0)+1;
    DB.set('counters',counters);
    code=`${counters[data.branch_id]}/${br.code}`;
    facId=uid();
    facilities.unshift({id:facId,...data,code,registered_at:nowISO(),deleted:false});
    DB.set('facilities',facilities);
  }
  
  const insps=DB.get('inspections',[]);
  const iid=id||uid();
  if(id){const idx=insps.findIndex(i=>i.id===id);if(idx>=0)insps[idx]={...insps[idx],...data,facility_id:facId,status:asDraft?'draft':'approved'}}
  else{insps.unshift({id:iid,...data,facility_id:facId,inspector_id:u.id,status:asDraft?'draft':'approved',inspection_date:data.inspection_date,deleted:false})}
  DB.set('inspections',insps);
  
  if(!asDraft&&data.samples.length){
    const samples=DB.get('samples',[]),br=DB.get('branches',[]).find(b=>b.id===data.branch_id);
    const ymd=new Date().toISOString().slice(2,10).replace(/-/g,'');
    data.samples.forEach(s=>{
      const rnd=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
      samples.unshift({...s,id:uid(),code:`${br.code}-${ymd}-${rnd}`,facility_id:facId,inspection_id:iid,collected_at:nowISO(),status:'pending',deleted:false});
    });
    DB.set('samples',samples);
  }
  
  // Generate inspection claim
  if(!asDraft){
    const claims=DB.get('claims',[]);
    if(!claims.find(c=>c.inspection_id===iid&&c.type==='inspection')){
      const fees=DB.get('fees');
      const base=data.classification==='commercial'?fees.insp_comm:fees.insp_ind;
      const vat=base*(fees.vat/100);
      claims.push({id:uid(),type:'inspection',serial:'INSP-'+(claims.length+1),inspection_id:iid,facility_id:facId,date:today(),base_amount:base,vat_amount:vat,total:base+vat,status:'draft',lines:[{label:'رسوم معاينة',qty:1,rate:base,total:base}],reviewer:'u3'});
      DB.set('claims',claims);
    }
  }
  
  toast(`تم — كود: ${code}`,'success');
  location.hash='#/facility/'+facId;
}

function saveResult(sid){
  const form=document.querySelector('form');
  const get=n=>form.querySelector(`[name="${n}"]`)?.value;
  const lim=DB.get('limits');
  const data={bod:parseFloat(get('p_bod'))||null,cod:parseFloat(get('p_cod'))||null,tss:parseFloat(get('p_tss'))||null,og:parseFloat(get('p_og'))||null,ph:parseFloat(get('p_ph'))||null,temperature:parseFloat(get('p_temperature'))||null,settle_10:parseFloat(get('p_settle_10'))||null,settle_15:parseFloat(get('p_settle_15'))||null};
  let pass=true;
  if(data.bod!=null&&data.bod>lim.bod)pass=false;
  if(data.cod!=null&&data.cod>lim.cod)pass=false;
  if(data.tss!=null&&data.tss>lim.tss)pass=false;
  if(data.og!=null&&data.og>lim.og)pass=false;
  if(data.ph!=null&&(data.ph<lim.ph_min||data.ph>lim.ph_max))pass=false;
  
  const results=DB.get('results',[]);
  const i=results.findIndex(r=>r.sample_id===sid&&!r.deleted);
  const payload={...data,sample_id:sid,auto_status:pass?'pass':'fail',entered_by:Session.user.id,entered_at:nowISO(),deleted:false};
  if(i>=0){payload.id=results[i].id;results[i]={...results[i],...payload}}
  else{payload.id=uid();results.unshift(payload)}
  DB.set('results',results);
  
  const samples=DB.get('samples',[]);
  const si=samples.findIndex(s=>s.id===sid);
  if(si>=0){samples[si].status=payload.auto_status;DB.set('samples',samples)}
  
  generateFromSample(sid);
  toast(pass?'مطابقة':'غير مطابقة — تم توليد المطالبات',pass?'success':'error');
  nav();
}

  const reports=DB.get('gw_reports',[]);
  const i=reports.findIndex(r=>r.facility_id===fid);
  const data={facility_id:fid,daily_qty:parseFloat(form.qty.value),days:parseInt(form.days.value),approved:true,date:today()};
  if(i>=0)reports[i]=data;else reports.push({id:uid(),...data});
  DB.set('gw_reports',reports);
  toast('تم الحفظ','success');location.hash='#/groundwater';
}

function genGwCycle(){
  const reports=DB.get('gw_reports',[]).filter(r=>r.approved);
  const facs=DB.get('facilities',[]).filter(f=>!f.deleted);
  const fees=DB.get('fees');
  const claims=DB.get('claims',[]);
  const cycle='نوفمبر–ديسمبر 2026';
  let added=0;
  reports.forEach(rep=>{
    const f=facs.find(x=>x.id===rep.facility_id);
    if(!f)return;
    const br=DB.get('branches',[]).find(b=>b.id===f.branch_id);
    if(!br?.gw_enabled)return;
    if(claims.find(c=>c.type==='groundwater'&&c.facility_id===f.id&&c.cycle===cycle))return;
    const qty=rep.daily_qty*rep.days*2;
    const base=qty*fees.gw_rate;
    const vat=base*(fees.vat/100);
    claims.push({id:uid(),type:'groundwater',serial:'GW-'+(claims.length+1),facility_id:f.id,cycle,date:today(),base_amount:base,vat_amount:vat,total:base+vat,status:'draft',lines:[{label:'جوفي '+cycle,qty:qty,rate:fees.gw_rate,total:base}]});
    added++;
  });
  DB.set('claims',claims);
  toast(`تم توليد ${added} مطالبة جوفي`,'success');
  nav();
}

        <div><b>الحالة:</b> <span class="badge bbl">${statusLabel(l.status)}</span></div>
      </div>
    </div>
    <div class="sh">المستندات المطلوبة</div>
    <div class="card">${docsHTML}</div>
    <div style="display:grid;gap:10px;margin-top:16px">
      ${l.status==='new'||l.status==='checking'?`<button class="btn btn-p btn-block btn-lg" onclick="referLic('${l.id}')">📤 إحالة للرقابة</button>`:''}
      ${l.status==='referred'&&canApprove?`<button class="btn btn-g btn-block btn-lg" onclick="approveLic('${l.id}')">✅ اعتماد وإدراج بالخطة</button>`:''}
      ${l.status==='approved'?`<button class="btn btn-o btn-block" onclick="window.print()">🖨️ لا مانع من التوصيل</button>`:''}
    </div>
  `,'المزيد');
});

function toggleDoc(lid,doc,checked){
  const licenses=DB.get('licenses',[]);
  const i=licenses.findIndex(l=>l.id===lid);
  if(i>=0){if(!licenses[i].docs)licenses[i].docs={};licenses[i].docs[doc]=checked;DB.set('licenses',licenses);toast('تم التحديث','success')}
}

function referLic(id){
  const licenses=DB.get('licenses',[]);
  const i=licenses.findIndex(l=>l.id===id);
  if(i>=0){licenses[i].status='referred';DB.set('licenses',licenses);toast('تمت الإحالة','success');nav()}
}

function approveLic(id){
  const licenses=DB.get('licenses',[]);
  const i=licenses.findIndex(l=>l.id===id);
  if(i>=0){
    licenses[i].status='approved';
    DB.set('licenses',licenses);
    const plans=DB.get('plan_items',[]);
    plans.push({id:uid(),date:today(),facility_id:null,facility_name_temp:licenses[i].facility_name,branch_id:licenses[i].branch_id,inspector_id:'u6',status:'scheduled',priority:'max',reason:'طلب توصيل',license_id:id});
    DB.set('plan_items',plans);
    toast('تم الاعتماد والإدراج في الخطة','success');location.hash='#/plans';
  }
}

function saveFees(form){
  const g=n=>form.querySelector(`[name="${n}"]`).value;
  DB.set('fees',{
    insp_comm:parseFloat(g('insp_comm')),insp_ind:parseFloat(g('insp_ind')),
    vat:parseFloat(g('vat')),gw_rate:parseFloat(g('gw_rate')),
    analysis:parseFloat(g('analysis')),disposal_ratio:parseFloat(g('disposal_ratio')),
    cod_discount:parseFloat(g('cod_discount')),pay_days:parseInt(g('pay_days')),
    apply_vat_burden:g('apply_vat_burden')==='true',issue_analysis_fail:g('issue_analysis_fail')==='true',
    transport:0,delay_days:60
  });
  toast('تم الحفظ','success');nav();
}

route('/settings/assign',()=>{
  if(Session.user.role!=='gm'){location.hash='#/more';return}
  const branches=DB.get('branches',[]);
  const assigns=DB.get('assignments',[]);
  const users=DB.get('users',[]);
  layout(`
    <div class="pt">توزيع مسؤولي المطالبات</div>
    ${branches.map(b=>{
      const a=assigns.find(x=>x.branch_id===b.id);
      const userId=a?.primary||'';
      return `<div class="card">
        <div style="font-weight:700;margin-bottom:8px">${esc(b.name)} (كود ${b.code})</div>
        <select onchange="setAssign('${b.id}',this.value)">
          <option value="">— بدون —</option>
          ${users.filter(u=>u.role==='field'||u.role==='control_mgr'||u.role==='control_claims').map(u=>`<option value="${u.id}" ${userId===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}
        </select>
      </div>`;
    }).join('')}
  `,'المزيد');
});

function setAssign(bid,uid){
  const assigns=DB.get('assignments',[]);
  const i=assigns.findIndex(a=>a.branch_id===bid);
  if(i>=0){if(uid)assigns[i].primary=uid;else assigns.splice(i,1)}else if(uid)assigns.push({branch_id:bid,primary:uid});
  DB.set('assignments',assigns);
  toast('تم التحديث','success');
}
