<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d2d5a">
<title>الرقابة على الصرف الصناعي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#0d2d5a; --primary-l:#1a4a8a; --primary-xl:#e6edf7;
  --bg:#f5f7fb; --card:#fff; --border:#dbe3ee;
  --text:#0e1b2e; --muted:#64748b;
  --green:#15803d; --green-bg:#dcfce7;
  --red:#b91c1c; --red-bg:#fee2e2;
  --yellow:#a16207; --yellow-bg:#fef3c7;
  --blue:#1d4ed8; --blue-bg:#dbeafe;
  --shadow:0 2px 8px rgba(13,45,90,.08);
  --shadow-lg:0 8px 24px rgba(13,45,90,.15);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;font-family:'Cairo',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
body{min-height:100vh;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
input,select,textarea,button{font-family:inherit;font-size:15px}
button{cursor:pointer;border:none;font-weight:600}
input,select,textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:12px;background:#fff;color:var(--text);-webkit-appearance:none;appearance:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary-l);box-shadow:0 0 0 3px rgba(26,74,138,.12)}
textarea{resize:vertical;min-height:70px}
label{display:block;font-weight:600;font-size:13.5px;margin-bottom:6px;color:var(--text)}
label .req{color:var(--red);margin-right:2px}
.field{margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 18px;border-radius:12px;font-size:15px;font-weight:700;transition:transform .08s;min-height:48px;user-select:none}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--primary);color:#fff}
.btn-outline{background:#fff;color:var(--primary);border:1.5px solid var(--primary)}
.btn-ghost{background:transparent;color:var(--primary)}
.btn-danger{background:var(--red);color:#fff}
.btn-success{background:var(--green);color:#fff}
.btn-block{display:flex;width:100%}
.btn-sm{padding:8px 12px;font-size:13px;min-height:38px;border-radius:10px}
.btn-lg{min-height:56px;font-size:16px}
.card{background:var(--card);border-radius:16px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.badge{display:inline-flex;align-items:center;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;line-height:1.6}
.badge-green{background:var(--green-bg);color:var(--green)}
.badge-red{background:var(--red-bg);color:var(--red)}
.badge-yellow{background:var(--yellow-bg);color:var(--yellow)}
.badge-blue{background:var(--blue-bg);color:var(--blue)}
.badge-gray{background:#eef2f7;color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:4px}

.topbar{position:sticky;top:0;z-index:50;background:var(--primary);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow)}
.topbar h1{font-size:15px;margin:0;font-weight:700;flex:1;line-height:1.3}
.topbar .avatar{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0}
.topbar button{background:transparent;color:#fff;padding:8px;border-radius:10px;font-size:13px}

.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom);z-index:50;box-shadow:0 -2px 12px rgba(13,45,90,.06)}
.bottomnav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:10px 4px;color:var(--muted);text-decoration:none;font-size:11px;font-weight:600;min-height:60px}
.bottomnav a.active{color:var(--primary)}
.bottomnav a svg{width:22px;height:22px}

.page{padding:14px;max-width:720px;margin:0 auto}
.page-title{font-size:20px;font-weight:800;margin:6px 0 14px;color:var(--primary);display:flex;align-items:center;gap:10px}
.page-title .sub{font-size:13px;color:var(--muted);font-weight:500;margin-right:auto}

.item{background:#fff;border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);border-right:4px solid var(--primary-l);display:block;text-decoration:none;color:inherit;transition:transform .08s}
.item:active{transform:scale(.985)}
.item .row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.item .ttl{font-weight:700;font-size:15px;flex:1;color:var(--primary)}
.item .meta{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:6px}

.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.stat{background:#fff;border-radius:14px;padding:14px;box-shadow:var(--shadow);text-align:center}
.stat .num{font-size:26px;font-weight:800;color:var(--primary);line-height:1.1}
.stat .lbl{font-size:12px;color:var(--muted);margin-top:4px;font-weight:600}
.stat.warn .num{color:var(--red)}

.section-h{display:flex;align-items:center;gap:10px;margin:20px 0 12px;font-weight:800;font-size:16px;color:var(--primary)}
.section-h::before{content:'';width:4px;height:20px;background:var(--primary);border-radius:2px}

.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(120px);background:#1a2436;color:#fff;padding:12px 20px;border-radius:12px;font-size:14px;font-weight:600;box-shadow:var(--shadow-lg);z-index:200;transition:transform .3s;max-width:90vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{background:var(--green)}
.toast.error{background:var(--red)}

.login-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(160deg,var(--primary),#081e3f)}
.login-box{background:#fff;border-radius:22px;padding:26px 22px;width:100%;max-width:420px;box-shadow:var(--shadow-lg)}
.login-box .logo{width:64px;height:64px;border-radius:18px;background:var(--primary);color:#fff;display:grid;place-items:center;font-size:26px;font-weight:800;margin:0 auto 14px}
.login-box h2{text-align:center;font-size:20px;color:var(--primary);margin:0 0 4px}
.login-box p{text-align:center;color:var(--muted);font-size:13px;margin:0 0 20px}
.demo-users{background:var(--primary-xl);border-radius:12px;padding:12px;font-size:12px;margin-top:16px;color:var(--primary);line-height:1.8}
.demo-users b{display:block;margin-bottom:4px;font-size:13px}
.demo-users code{background:#fff;padding:2px 6px;border-radius:6px;font-family:ui-monospace,monospace;font-size:11.5px}

.sample-card{background:var(--primary-xl);border:1.5px solid var(--border);border-radius:12px;padding:12px;margin-bottom:10px;position:relative}
.sample-card .sample-code{font-family:ui-monospace,monospace;background:#fff;padding:4px 10px;border-radius:8px;font-size:13px;font-weight:700;color:var(--primary);display:inline-block;margin-bottom:10px}
.sample-card .rm{position:absolute;top:8px;left:8px;background:var(--red);color:#fff;width:28px;height:28px;border-radius:8px;font-size:16px;padding:0}

.res-row{display:grid;grid-template-columns:1fr 110px;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--border)}
.res-row .name{font-size:13.5px;font-weight:600}
.res-row .name small{display:block;color:var(--muted);font-weight:500;font-size:11.5px;margin-top:2px}
.res-row input{padding:10px 12px;text-align:center;font-weight:700;font-size:15px}
.res-row input.bad{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.res-row input.good{border-color:var(--green)}

.empty{text-align:center;padding:50px 20px;color:var(--muted)}
.empty p{margin:0;font-size:14px}
hr.sep{border:none;border-top:1px dashed var(--border);margin:16px 0}
.mono{font-family:ui-monospace,SFMono-Regular,monospace;font-size:13px}
.text-muted{color:var(--muted)}
.text-red{color:var(--red)}
.text-green{color:var(--green)}
.tiny{font-size:11.5px}

.modal-bg{position:fixed;inset:0;background:rgba(13,45,90,.6);display:none;align-items:flex-end;justify-content:center;z-index:300;backdrop-filter:blur(2px)}
.modal-bg.show{display:flex}
.modal{background:#fff;border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:92vh;overflow-y:auto;padding:20px;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(60px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-h h3{margin:0;font-size:17px;color:var(--primary)}
.modal-h button{background:transparent;color:var(--muted);font-size:22px;padding:4px 8px;line-height:1}

.pump-row{background:var(--primary-xl);border-radius:12px;padding:12px;margin-bottom:10px;position:relative}
.pump-row .rm{position:absolute;top:6px;left:6px;background:var(--red);color:#fff;width:28px;height:28px;border-radius:8px;font-size:16px;line-height:1;padding:0}

/* Print Styles */
@media print {
  body { background: #fff; padding: 0; margin: 0; }
  .topbar, .bottomnav, .btn, .no-print, .page-title, .section-h { display: none !important; }
  .page { padding: 0; max-width: 100%; }
  .card { box-shadow: none; border: 1px solid #000; border-radius: 0; margin: 0; padding: 20px; }
  .print-header { display: block !important; text-align: center; margin-bottom: 20px; }
  .print-table { width: 100%; border-collapse: collapse; margin: 15px 0; }
  .print-table th, .print-table td { border: 1px solid #000; padding: 8px; text-align: right; }
  .print-footer { margin-top: 40px; display: flex !important; justify-content: space-between; }
}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<div id="modal" class="modal-bg"><div class="modal" id="modalContent"></div></div>

<script>
// سيتم وضع كود الجافاسكريبت هنا في الجزء الثاني
</script>
</body>
</html>
